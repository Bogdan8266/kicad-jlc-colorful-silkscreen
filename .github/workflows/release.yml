name: Build PCM Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build and test dependencies
        run: pip install Pillow cryptography

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Build KiCad PCM ZIP
        run: python3 build_pcm.py

      - name: Upload ZIP to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
